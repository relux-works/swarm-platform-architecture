x="836.5664" y="679.4653">No API returns a private key. A prompt-injected agent can ask for</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="401.9653" x="836.5664" y="694.5981">signatures of what it is allowed to send, and nothing else: the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="421.6938" x="836.5664" y="709.731">signature request is audited, rate-limited and tied to the identity</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="342.4814" x="836.5664" y="724.8638">the kernel reports, not to anything the agent claims.</text><!--SRC=[PLN1RXit4BtlLqnzYOJAKfp23gh00GIaG0CXhH4bjm06TpdIigB8BScLid1zxGVq4_ibVSELrX9wiG7kp9itxysCVaWrxvWQgumhaacMQSaTRPaR3ZJQtqn_6iz9KHDynJ6IYjj8Qn_m5Ct6gTG69hzdUR2-KfQYhxQStX60Jp16iqjcRJZcLqHPl9OTDOp_Npz-8ELqnejqCAb6b4h7hDIzYi3fUi0ccBrA0joHOobhMUsFk7srecXKIAOoZNA9hXORe9peVtEZtrVKHg7x-7PyXNPeSHd_rPdlnnw-kTbUXLbetImULDYfMLzXAfy1jVEQwVNTtLqFjBe4Uf4HeSBRMDwm9gruvrsVibmMMYLLgiXqzKd516AHgo2rHokkHDnVN6NH8iteoyCd_Ftmi7ZusAV_kZfB_ymR4rFea7bIZlxz-nzgsjAQIXIRPAbtgkcpFnV5WgxVqsfEbNUEAvWM-C-MOyfUF9LTulWOQ_Nczcu2dD3uoC_5IfAMoo7BU4S_zbQ2UIwjRAHHQpJTlhvvYrIZnyLoUSexVSZq1gwDWl7mIRTLcZtCuCyhqLWrT0Wc9NOoC6ApDX6nLIqc9Z2MjZcC2sLJXcxTrlc38nzUm0Fl_PPrGIGqm6CnnziQaw2VZl6FallNAVAvO0jLyvTZrdleFIVDi997mdPCnaMKoAnYxrRfMwTLw6XKgu3gCBogZKN_XFHSMYGGVOtRO1KQLHeh56MfKcqYUOoC4bM7kgSCX3llZ6nPzkOTgLQRHDOufYVmdmmT3tvDeDS6bauWrlD5_o_x-wJiXbY_kRsz-NaYa_8eK7jbMzZDJXV5_Jtv98htknlf_hvmFXrN7sDCWn6Zp2FhCp_toZiBLKn2Wp07apYXJP1DaNMSOdAmr-EC8mOCCmmGn7F05H32q5DLYR9M_n-5P0830YEF9iuXbEkyaqyQszKrQLHQN-9TGCxkp95PvehWB_XQ1gCtV3nEcFIIQsNNvDTo57rCugBADoOtE9mlfETdeEQP6CfSN4PGhxRzzIgDqm8MkF91JqLt4ecp-0SvY70V3rIhfi4sN3YmcCWn8FhD4ww3AD46y5Nd1tDA2zclNPEkZVi3YojQPkO0biCk8mYCOIwYT9ahOyOmcB3U7v2KFARTmMJLKwo5jgnBrlCSORWdaYsZoiZ2SFErDJkJ2G0YcHxqt0oWz385nnOmZGyfJgIQHCBElgh477l0BzWkliZs7m00]--></g></svg>